<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAP Stock Check · StockControl</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<script src="js/proteger.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo-sidebar">
<img src="img/logo.svg" alt="StockControl">
<h2>Stock<br>Control</h2>
</div>

<div class="menu">

<a href="dashboard.html">📊 Dashboard</a>

<a href="index.html">📦 Products</a>

<a href="cadastro.html">➕ Add Product</a>

<a href="movimentacao.html">🔄 Movements</a>

<a href="mapa.html">🗺️ Map</a>

<a href="importar.html">📥 Import</a>

<a href="sap.html">📊 SAP Stock Check</a>

<a href="usuarios.html">👤 Users</a>

</div>

<div class="user-box">

<div class="usuario">
👤 <span id="usuarioLogado"></span>
</div>

<button class="btn-logout" onclick="logout()">
Sign out
</button>

</div>

</div>


<!-- CONTEÚDO -->
<div class="main">

<h1>SAP Stock Check</h1>

<div class="upload-container">

<h3>Import the SAP Excel report</h3>

<div class="upload-box">

<input type="file" id="excelFile" hidden>

<button class="btn-escolher" onclick="document.getElementById('excelFile').click()">
📂 Choose Excel file
</button>

<span id="nomeArquivo">No file selected</span>

<button class="btn-importar" onclick="importarExcel()">
📥 Import
</button>

</div>

</div>

<div style="display:flex; gap:10px; margin:15px 0;">

<button onclick="exportarExcel()" class="btn-importar">
📊 Export Excel
</button>

<button onclick="imprimirRelatorio()" class="btn-escolher">
🖨 Print
</button>

</div>

<table id="tabelaSAP" class="tabela-produtos">

<thead>
<tr>
<th>Material</th>
<th>Product</th>
<th>System Stock</th>
<th>SAP Stock</th>
<th>Difference</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>


<!-- SCRIPTS -->
<script src="js/sap.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>

let usuario = localStorage.getItem("usuario");

if(usuario){

let dados = JSON.parse(usuario);

document.getElementById("usuarioLogado").innerText = dados.nome || dados.email;

}else{

window.location.href = "login.html";

}

function logout(){

localStorage.removeItem("usuario");

window.location.href = "login.html";

}

</script>

</body>
</html>

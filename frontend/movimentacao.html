<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Movements · StockControl</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/movimentacao.css">

<script src="js/proteger.js"></script>
</head>

<body>

<div class="sidebar">

<div class="logo-sidebar">
<img src="img/logo.svg" alt="StockControl">
<h2>Stock<br>Control</h2>
</div>

<div class="menu">

<a href="dashboard.html">📊 Dashboard</a>

<a href="index.html">📦 Products</a>

<a href="cadastro.html">➕ Add Product</a>

<a href="movimentacao.html">🔄 Movements</a>

<a href="mapa.html">🗺️ Map</a>

<a href="importar.html">📥 Import</a>

<a href="sap.html">📊 SAP Stock Check</a>

<a href="usuarios.html">👤 Users</a>

</div>

<div class="user-box">

<div class="usuario">
👤 <span id="usuarioLogado"></span>
</div>

<button class="btn-logout" onclick="logout()">
Sign out
</button>

</div>

</div>

<div class="main">

<div class="mov-container">

<h1>Stock Movements</h1>

<div class="form-mov">

<input id="codigo" placeholder="Type or scan the code">
<button onclick="buscarProduto()">Search</button>

<input id="descricao" placeholder="Product" readonly>
<input type="hidden" id="produto">

<select id="tipo">
<option value="entrada">Stock in</option>
<option value="saida">Stock out</option>
</select>

<input id="quantidade" type="number" placeholder="Quantity">

<input id="obs" placeholder="Note">

<button onclick="salvarMovimentacao()" class="btn-salvar">
Save
</button>

</div>

<h2>Movement History</h2>

<table id="tabelaMovimentacoes">
<thead>
<tr>
<th>Product</th>
<th>Type</th>
<th>Quantity</th>
<th>User</th>
<th>Date</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script src="js/movimentacao.js"></script>

</body>
</html>

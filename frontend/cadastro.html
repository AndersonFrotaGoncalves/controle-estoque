<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product · StockControl</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/proteger.js"></script>
</head>

<body>

<div class="sidebar">

<div class="logo-sidebar">
<img src="img/logo.svg" alt="StockControl">
<h2>Stock<br>Control</h2>
</div>

<div class="menu">

<a href="dashboard.html">📊 Dashboard</a>

<a href="index.html">📦 Products</a>

<a href="cadastro.html">➕ Add Product</a>

<a href="movimentacao.html">🔄 Movements</a>

<a href="mapa.html">🗺️ Map</a>

<a href="importar.html">📥 Import</a>

<a href="sap.html">📊 SAP Stock Check</a>

<a href="usuarios.html">👤 Users</a>

</div>

<div class="user-box">

<div class="usuario">
👤 <span id="usuarioLogado"></span>
</div>

<button class="btn-logout" onclick="logout()">
Sign out
</button>

</div>

</div>

<div class="main">

    <h1 id="tituloFormulario">Add Product</h1>

    <div class="form-container">

        <form id="formProduto">

            <div class="form-grid">

                <div class="form-group">
                    <label for="codigo">Code</label>
                    <input type="text" id="codigo" placeholder="Enter the product code" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Description</label>
                    <input type="text" id="descricao" placeholder="Product description" required>
                </div>

                <div class="form-group">
                    <label for="rack">Rack</label>
                    <input type="text" id="rack" placeholder="e.g. A01" required>
                </div>

                <div class="form-group">
                    <label for="nivel">Level</label>
                    <input type="number" id="nivel" placeholder="e.g. 1" required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantity</label>
                    <input type="number" id="quantidade" placeholder="Quantity in stock" required>
                </div>

                <div class="form-group">
                    <label for="quantidade_minima">Minimum Quantity</label>
                    <input type="number" id="quantidade_minima" placeholder="Minimum stock">
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Product</button>
                <a href="index.html" class="btn-secundario">Cancel</a>
            </div>

        </form>

    </div>

</div>

<div id="toast" class="toast"></div>

<!-- login protection -->

<!-- app functions -->
<script src="js/app.js"></script>

</body>
</html>
